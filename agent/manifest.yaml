schema_version: "1.0"
id: ai-invest-assistant
name: AI 金融助手
description: 面向多市场投资研究、选股、组合风险和绩效复盘的低 Token 金融 Agent。
mode:
  default: low-token
  allow_user_override: true
orchestration:
  primary_agent: ai-invest-workflow
  router_skill: intent-router
  loading:
    strategy: progressive
    preload_all_skills: false
    standard_task_skill_limit: 3
    max_auxiliary_skills: 2
    references: on-demand
    templates: on-demand
  context:
    read_strategy: relevant-data-first
    reuse_verified_facts: true
    summary_fields: [market, instrument, period, source, timestamp, currency, adjustment, confirmed_facts, assumptions, decisions, risks, unresolved_items]
    pass_full_history_between_stages: false
  task_levels:
    S0: {description: "金融概念或单点解释", skills: 0, workflow: direct}
    S1: {description: "单一研究或分析任务", skills: 1, workflow: single-skill}
    S2: {description: "多维分析、选股或组合评估", skills: "2-3", workflow: staged}
    S3: {description: "全链路投资研究、策略或组合风险任务", skills: progressive, workflow: staged-with-quality-gates}
routing:
  primary_skill_required: true
  allow_multiple_primary_skills: false
  invoke_auxiliary_only_when_needed: true
  avoid_duplicate_data_queries: true
  respect_explicit_market_and_scope: true
financial_controls:
  separate_facts_expectations_judgments_recommendations: true
  require_data_timestamp_for_market_claims: true
  require_source_for_external_data: true
  prohibit_return_guarantees: true
  prohibit_unauthorized_trade_execution: true
  user_financial_data_isolation: strict
safety:
  use_only_available_tools: true
  verify_tool_permission_before_use: true
  require_explicit_authorization_for: [trade_execution, account_changes, fund_transfer, destructive_data_changes, external_publication]
  never_claim_unexecuted_actions: true
output:
  default: concise
  include_only_relevant_sections: true
  distinguish: [facts, expectations, judgments, recommendations, risks, not_verified]
